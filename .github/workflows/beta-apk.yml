name: Auto Clock Beta APK

on:
  push:
    branches: [revamp/low-power-v2]
  workflow_dispatch:

concurrency:
  group: autoclock-beta-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run unit tests and compile APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Copy APK with friendly filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AutoClock-2-v0.33-beta.apk

      - name: Create or update public beta download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.33.0-beta >/dev/null 2>&1; then
            gh release create v0.33.0-beta \
              --target "$GITHUB_SHA" \
              --title "Auto Clock 2 — beta 0.33.0" \
              --notes "Analog positioning correction: original v0.29/v0.30 Y=216 with radius122. Set large analog Y=222, only 6px below original to barely clear upper edge, not centered Y=254. Keep original X=256, radius122 and zero added padding. All other UI, forecast and playback unchanged." \
              --prerelease
          fi
          gh release upload v0.33.0-beta dist/AutoClock-2-v0.33-beta.apk --clobber
