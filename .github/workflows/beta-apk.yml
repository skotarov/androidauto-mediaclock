name: Auto Clock Beta APK

on:
  push:
    branches: [revamp/low-power-v2]
  workflow_dispatch:

concurrency:
  group: autoclock-beta-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run unit tests and compile APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Copy APK with friendly filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AutoClock-2-v0.22-beta.apk

      - name: Create or update public beta download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.22.0-beta >/dev/null 2>&1; then
            gh release create v0.22.0-beta \
              --target "$GITHUB_SHA" \
              --title "Auto Clock 2 — beta 0.22.0" \
              --notes "Auto weather now defaults to nearby METAR station with permission on first phone launch, while honoring explicitly chosen cities. Artwork shows only city, not (ICAO). Static dock icon hands softened. Other v0.21 features unchanged." \
              --prerelease
          fi
          gh release upload v0.22.0-beta dist/AutoClock-2-v0.22-beta.apk --clobber
