name: Auto Clock Beta APK

on:
  push:
    branches: [revamp/low-power-v2]
  workflow_dispatch:

concurrency:
  group: autoclock-beta-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run unit tests and compile APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Copy APK with friendly filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AutoClock-2-v0.39-beta.apk

      - name: Create or update public beta download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.39.0-beta >/dev/null 2>&1; then
            gh release create v0.39.0-beta \
              --target "$GITHUB_SHA" \
              --title "Auto Clock 2 — beta 0.39.0" \
              --notes "Third isolated Android Auto routing experiment: STATE_STOPPED, in addition to existing direct-browse and STATE_NONE tests. To evaluate it, disable Tests 1 and 2, enable Test 3, reconnect Android Auto, and check whether the split-screen clock remains available while opening the hourly list. No changes to clock rendering, settings, power schedule, or six-hour forecast." \
              --prerelease
          fi
          gh release upload v0.39.0-beta dist/AutoClock-2-v0.39-beta.apk --clobber
