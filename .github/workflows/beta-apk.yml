name: Auto Clock Beta APK

on:
  push:
    branches: [revamp/low-power-v2]
  workflow_dispatch:

concurrency:
  group: autoclock-beta-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run unit tests and compile APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Copy APK with friendly filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AutoClock-2-v0.38-beta.apk

      - name: Create or update public beta download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.38.0-beta >/dev/null 2>&1; then
            gh release create v0.38.0-beta \
              --target "$GITHUB_SHA" \
              --title "Auto Clock 2 — beta 0.38.0" \
              --notes "Redesigned minimalist phone settings: two square analog/digital preview thumbnails with a blue selection border, both live-update with Light theme checkbox immediately below. Remove explanatory text, colored icon switch, manual city choice, refresh button and compact text switch. Auto-only weather on both phone/service, refreshed on settings open and Pause/Stop plus regular 15m current/forecast checks. Both existing screen experiments remain available. Six-hour full-screen forecast and quiet dashboard preserved." \
              --prerelease
          fi
          gh release upload v0.38.0-beta dist/AutoClock-2-v0.38-beta.apk --clobber
