name: Auto Clock Beta APK

on:
  push:
    branches: [revamp/low-power-v2]
  workflow_dispatch:

concurrency:
  group: autoclock-beta-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run unit tests and compile with permanent beta key
        env:
          BETA_SIGNING_SECRET: ${{ secrets.AUTO_CLOCK_BETA_SIGNING }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BETA_SIGNING_SECRET:-}" ]]; then
            echo "::error::Configure repository secret AUTO_CLOCK_BETA_SIGNING before publishing a beta."
            exit 1
          fi
          mapfile -t signing_lines <<< "$BETA_SIGNING_SECRET"
          if [[ "${#signing_lines[@]}" -lt 2 ]]; then
            echo "::error::Invalid beta signing secret."
            exit 1
          fi
          export AUTO_CLOCK_BETA_PASSWORD="${signing_lines[0]%$'\r'}"
          encoded_store="${signing_lines[1]%$'\r'}"
          echo "::add-mask::$AUTO_CLOCK_BETA_PASSWORD"
          echo "::add-mask::$encoded_store"
          export AUTO_CLOCK_BETA_STORE="$RUNNER_TEMP/autoclock-beta.p12"
          umask 077
          trap 'rm -f "$AUTO_CLOCK_BETA_STORE"' EXIT
          printf '%s' "$encoded_store" | base64 --decode > "$AUTO_CLOCK_BETA_STORE"
          unset BETA_SIGNING_SECRET encoded_store signing_lines
          fingerprint=$(keytool -exportcert -storetype PKCS12 -keystore "$AUTO_CLOCK_BETA_STORE" -storepass:env AUTO_CLOCK_BETA_PASSWORD -alias autoclock-beta | sha256sum | cut -d' ' -f1)
          if [[ "$fingerprint" != "b29e5f80e27dd8aeebb7ede5329a9ffe46a1d8ef7270e2981aae32233fd9b2b1" ]]; then
            echo "::error::Beta certificate does not match the permanent signing identity."
            exit 1
          fi
          gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          # Explicitly sign the distribution APK rather than relying on Gradle's
          # debug signing configuration. apksigner replaces existing signatures.
          mkdir -p dist
          "$signer" sign --ks "$AUTO_CLOCK_BETA_STORE" --ks-type PKCS12 \
            --ks-key-alias autoclock-beta --ks-pass env:AUTO_CLOCK_BETA_PASSWORD \
            --key-pass env:AUTO_CLOCK_BETA_PASSWORD \
            --out dist/AutoClock-2-v0.88-beta.apk app/build/outputs/apk/debug/app-debug.apk
          verification=$("$signer" verify --verbose --print-certs dist/AutoClock-2-v0.88-beta.apk)
          printf '%s\n' "$verification"
          actual=$(printf '%s\n' "$verification" | awk '/^(Signer #[0-9]+|V[0-9]+([.][0-9]+)? Signer):? certificate SHA-256 digest:/ {print $NF}' | tr -d ':\r' | tr '[:upper:]' '[:lower:]')
          if ! printf '%s\n' "$verification" | grep -Eq '^Number of signers: 1[[:space:]]*$' || [[ "$actual" != "$fingerprint" ]]; then
            echo "::error::Distribution APK signer does not match the pinned certificate."
            exit 1
          fi
          echo "Permanent beta certificate verified."

      - name: Create or update public beta download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.88.0-beta >/dev/null 2>&1; then
            gh release create v0.88.0-beta \
              --target "$GITHUB_SHA" \
              --title "Auto Clock 2 — beta 0.88.0" \
              --notes "Permanent beta signing identity. Uninstall older differently signed beta builds once; subsequent signed beta updates retain settings. Compact circular settings, right-side 10-second transport buttons and original alert chime selector." \
              --prerelease
          fi
          gh release upload v0.88.0-beta dist/AutoClock-2-v0.88-beta.apk --clobber
