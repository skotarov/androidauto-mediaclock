name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Build and test Play release bundle
        run: gradle --no-daemon testReleaseUnitTest bundleRelease --stacktrace

      - name: Upload unsigned Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: autoclock-play-unsigned-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autoclock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
