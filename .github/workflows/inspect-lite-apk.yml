name: Inspect published Lite and Universal APKs
on:
  push:
    branches: [diagnostics/lite-107-apk]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download published APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.107.0-beta --repo "$GITHUB_REPOSITORY" --pattern '*.apk'
      - name: Inspect APK contents and DEX strings
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, zipfile, collections, os, hashlib, struct
          for path in sorted(glob.glob('*.apk')):
              print('\nAPK', path, os.path.getsize(path), hashlib.sha256(open(path,'rb').read()).hexdigest())
              with zipfile.ZipFile(path) as z:
                  data = open(path,'rb').read()
                  infos = sorted(z.infolist(), key=lambda i:i.header_offset)
                  total = sum(i.compress_size for i in infos)
                  print('ZIP TOTAL compressed entries',total,'central directory offset',z.start_dir,'whole APK minus compressed entries',len(data)-total)
                  gaps = []
                  for i in infos:
                      offset=i.header_offset
                      nl,xl=struct.unpack_from('<HH',data,offset+26)
                      end=offset+30+nl+xl+i.compress_size
                      gaps.append((offset,end,i.filename,xl))
                  for n,(off,end,name,xl) in enumerate(gaps):
                      nextoff=gaps[n+1][0] if n+1<len(gaps) else z.start_dir
                      if nextoff-end>4096:
                          gap=data[end:nextoff]
                          print('LARGE GAP after',name,'bytes',len(gap),'zero bytes',gap.count(0),'start',gap[:24].hex(),'end',gap[-24:].hex())
                      if xl>4096: print('LARGE EXTRA',name,xl)
                  if z.start_dir>=24 and data[z.start_dir-16:z.start_dir]==b'APK Sig Block 42':
                      size=struct.unpack_from('<Q',data,z.start_dir-24)[0]
                      start=z.start_dir-size-8
                      print('APK SIGNING BLOCK bytes',size+8,'start',start)
                      pos=start+8
                      while pos<z.start_dir-24:
                          pairlen=struct.unpack_from('<Q',data,pos)[0]
                          if pairlen<4 or pos+8+pairlen>z.start_dir-24: break
                          pairid=struct.unpack_from('<I',data,pos+8)[0]
                          print('SIGNING PAIR',hex(pairid),'bytes',pairlen)
                          pos+=8+pairlen
                  groups = collections.Counter()
                  pdfassets = []
                  for i in z.infolist():
                      name = i.filename
                      group = '/'.join(name.split('/')[:2]) if '/' in name else name
                      groups[group] += i.compress_size
                      if 'pdfbox' in name.lower() or 'fontbox' in name.lower():
                          pdfassets.append(name)
                  print('GROUPS compressed bytes:', groups.most_common(25))
                  print('PDFBox/fontbox resources:', len(pdfassets))
                  print('Examples:', pdfassets[:10])
                  dex = [z.read(n) for n in z.namelist() if n.endswith('.dex')]
                  for marker in [b'Lcom/tom_roush/pdfbox/', b'Lcom/tom_roush/fontbox/', b'com/tom_roush/pdfbox', b'org/jsoup/', b'org/bouncycastle/']:
                      print(marker.decode(), 'occurrences:', sum(d.count(marker) for d in dex))
                  print('Largest entries:')
                  for i in sorted(z.infolist(), key=lambda i:i.compress_size, reverse=True)[:20]:
                      print(i.compress_size, i.file_size, i.filename)
          PY
